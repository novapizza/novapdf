[package]
name = "novapdf"
version = "0.3.0"
description = "NovaPDF desktop PDF editor"
authors = ["NovaPDF"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "novapdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
pdfium-render = { version = "0.9.5", default-features = false, features = ["pdfium_8125"] }
fontdb = "0.24.0"
ttf-parser = "0.25.1"
lopdf = { version = "0.47.0", default-features = false }
# Encryption keys for password-protected saves (already in the tree through lopdf).
getrandom = "0.4"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_SystemServices", "Win32_System_Diagnostics_Debug"] }

[target."cfg(target_os = \"macos\")".dependencies]
libc = "0.2"
