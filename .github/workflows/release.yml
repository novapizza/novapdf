name: Release

# Triggered by pushing a version tag, e.g.:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - 'v*.*.*'
  # Re-uploads an existing GitHub release to R2 without rebuilding.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to upload to R2, e.g. v0.1.0
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    name: Build and Publish macOS
    if: github.event_name == 'push'
    runs-on: macos-latest
    environment: Production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch, 2026-11-15
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: './src-tauri -> target'

      # npm ci runs the postinstall hook which calls scripts/fetch-pdfium.mjs
      - name: Install frontend dependencies
        run: npm ci

      # The bundled third-party notices must list what this build ships.
      - name: Check third-party notices
        run: npm run notices:check

      # The app is universal, so PDFium must be too; postinstall fetched only arm64.
      - name: Fetch universal PDFium
        run: node scripts/fetch-pdfium.mjs --universal --force

      # The cert goes into one keychain used for both the PDFium signature and
      # Tauri's. APPLE_CERTIFICATE is deliberately not passed to tauri-action,
      # which would import it into a second keychain.
      - name: Import Apple signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.CSC_LINK }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          rm "$RUNNER_TEMP/cert.p12"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      # Tauri signs the app bundle but not files under Contents/Resources, and
      # notarization rejects an unsigned or untimestamped dylib there.
      - name: Sign PDFium
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          codesign --force --timestamp --options runtime \
            --sign "$APPLE_SIGNING_IDENTITY" src-tauri/pdfium/libpdfium.dylib
          codesign --verify --strict --verbose=2 src-tauri/pdfium/libpdfium.dylib
          lipo -archs src-tauri/pdfium/libpdfium.dylib

      - name: Prepare updater config
        id: updater
        shell: bash
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: node scripts/updater-config.mjs src-tauri/tauri.updater.conf.json >> "$GITHUB_OUTPUT"

      - name: Build and publish macOS (universal binary)
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs with the identity from the keychain imported above.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Apple notarization
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Signs the updater bundle (.sig files) that latest.json is built from.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: NovaPDF ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          # publish-r2 writes latest.json with R2 URLs instead.
          includeUpdaterJson: false
          args: --target universal-apple-darwin ${{ steps.updater.outputs.config }}

  build-windows:
    name: Build and Publish Windows
    if: github.event_name == 'push'
    runs-on: windows-latest
    environment: Production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch, 2026-11-15

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: './src-tauri -> target'

      # npm ci runs the postinstall hook which calls scripts/fetch-pdfium.mjs
      - name: Install frontend dependencies
        run: npm ci

      # The bundled third-party notices must list what this build ships.
      - name: Check third-party notices
        run: npm run notices:check

      - name: Install Azure Code Signing SDK
        run: |
          # Pinned — bump alongside any Azure Trusted Signing endpoint version change.
          $sdkVersion = "1.0.60"
          $uri = "https://www.nuget.org/api/v2/package/Microsoft.Trusted.Signing.Client/$sdkVersion"
          Invoke-WebRequest -Uri $uri -OutFile "$env:RUNNER_TEMP\tsc.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\tsc.zip" -DestinationPath "$env:RUNNER_TEMP\tsc"
          $dlibDir = Get-ChildItem "$env:RUNNER_TEMP\tsc\bin" -Directory | Select-Object -First 1
          $dlibPath = Join-Path $dlibDir.FullName "Azure.CodeSigning.Dlib.dll"
          if (-not (Test-Path $dlibPath)) {
            Write-Error "Azure.CodeSigning.Dlib.dll not found under $($dlibDir.FullName). SDK layout may have changed."
            exit 1
          }
          "AZURE_DLIB_PATH=$dlibPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Write Azure Trusted Signing metadata
        env:
          AZURE_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_ACCOUNT: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
          AZURE_PROFILE: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
        run: |
          @{
            Endpoint               = $env:AZURE_ENDPOINT
            CodeSigningAccountName = $env:AZURE_ACCOUNT
            CertificateProfileName = $env:AZURE_PROFILE
          } | ConvertTo-Json | Out-File -FilePath "$env:RUNNER_TEMP\metadata.json" -Encoding utf8
          "AZURE_METADATA_PATH=$env:RUNNER_TEMP\metadata.json" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Write Tauri Windows signing config
        run: |
          # signtool is not on PATH on hosted runners, and Tauri spawns the command
          # without a shell. Use the newest x64 signtool from the Windows SDK: the
          # Azure dlib needs a recent one.
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } | Select-Object -Last 1
          if (-not $signtool) {
            Write-Error "signtool.exe not found in the Windows SDK."
            exit 1
          }
          # The {cmd, args} form keeps paths with spaces intact; the string form
          # is split on whitespace. Tauri replaces %1 with the file to sign.
          @{
            bundle = @{
              windows = @{
                signCommand = @{
                  cmd  = $signtool.FullName
                  args = @(
                    'sign', '/v', '/fd', 'SHA256',
                    '/tr', 'http://timestamp.acs.microsoft.com', '/td', 'SHA256',
                    '/dlib', $env:AZURE_DLIB_PATH,
                    '/dmdf', $env:AZURE_METADATA_PATH,
                    '%1'
                  )
                }
              }
            }
          } | ConvertTo-Json -Depth 6 | Out-File -FilePath "$env:RUNNER_TEMP\tauri-sign.json" -Encoding utf8
          "TAURI_SIGN_CONFIG=$env:RUNNER_TEMP\tauri-sign.json" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Prepare updater config
        id: updater
        shell: bash
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: node scripts/updater-config.mjs src-tauri/tauri.updater.conf.json >> "$GITHUB_OUTPUT"

      - name: Build and publish Windows
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Azure Trusted Signing credentials — read by the dlib at sign time.
          # azure/login is not needed: the dlib reads these env vars directly.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          # Signs the updater bundle (.sig files) that latest.json is built from.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: NovaPDF ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          # publish-r2 writes latest.json with R2 URLs instead.
          includeUpdaterJson: false
          args: --config ${{ env.TAURI_SIGN_CONFIG }} ${{ steps.updater.outputs.config }}

  publish-r2:
    name: Upload release to R2
    needs: [build-macos, build-windows]
    # On a tag push, only after both builds published; on manual dispatch the
    # builds are skipped and the existing release is uploaded.
    if: >-
      always() && (github.event_name == 'workflow_dispatch' ||
      (needs.build-macos.result == 'success' && needs.build-windows.result == 'success'))
    runs-on: ubuntu-latest
    environment: Production
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_RELEASES_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_RELEASES_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # R2 rejects the default CRC checksums newer AWS CLI versions send.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      R2_RELEASES_ACCOUNT_ID: ${{ secrets.R2_RELEASES_ACCOUNT_ID }}
      R2_RELEASES_BUCKET: ${{ secrets.R2_RELEASES_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release assets
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets
          # Manifests attached by an earlier run are regenerated below.
          rm -f assets/latest.yml assets/latest.json
          # The bundler names the macOS updater bundle after the product only, so
          # every release would overwrite one key in the flat bucket while an
          # older latest.json still points at it. Version it like the .dmg.
          VERSION="${TAG#v}"
          for f in assets/NovaPDF_universal.app.tar.gz assets/NovaPDF_universal.app.tar.gz.sig; do
            [ -e "$f" ] || continue
            mv -v "$f" "assets/NovaPDF_${VERSION}_universal.${f#assets/NovaPDF_universal.}"
          done
          ls -l assets

      - name: Write release manifests
        env:
          RELEASE_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: |
          mkdir -p manifest
          node scripts/write-release-manifest.mjs assets manifest/latest.yml

      - name: Upload installers to R2
        run: |
          aws s3 cp assets/ "s3://$R2_RELEASES_BUCKET/" --recursive \
            --endpoint-url "https://$R2_RELEASES_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --cache-control "public, max-age=31536000, immutable" --no-progress

      # After the installers: a manifest must never name a file that is not up
      # yet. Uncached, because these are the only keys whose content changes.
      - name: Publish manifests to R2
        run: |
          ENDPOINT="https://$R2_RELEASES_ACCOUNT_ID.r2.cloudflarestorage.com"
          aws s3 cp manifest/latest.yml "s3://$R2_RELEASES_BUCKET/latest.yml" \
            --endpoint-url "$ENDPOINT" --content-type "text/yaml; charset=utf-8" \
            --cache-control "no-cache, must-revalidate" --no-progress
          # Absent for an unsigned build; the previous latest.json then stays, so
          # installed apps keep pointing at an update they can verify.
          if [ -f manifest/latest.json ]; then
            aws s3 cp manifest/latest.json "s3://$R2_RELEASES_BUCKET/latest.json" \
              --endpoint-url "$ENDPOINT" --content-type "application/json; charset=utf-8" \
              --cache-control "no-cache, must-revalidate" --no-progress
          else
            echo "::warning::no latest.json, this release is not an update source"
          fi

      - name: Attach manifests to the GitHub release
        run: gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" manifest/latest.* --clobber
